<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profiflora – Filialsystem</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       LOGIN SCREEN
       ═══════════════════════════════════════════════════════════════════════ -->
  <div class="login-wrapper" id="login-screen">
    <div class="login-card">
      <div class="login-header">
        <h1>Profiflora</h1>
        <p>Filialsystem – Anmeldung</p>
      </div>
      <div class="login-body">
        <div class="login-error" id="login-error"></div>
        <div class="form-group">
          <label for="login-user">Benutzer</label>
          <select id="login-user" class="input">
            <option value="">— Bitte wählen —</option>
            <option value="admin">Admin (Dashboard)</option>
            <option value="filiale1">Filiale 1</option>
            <option value="filiale2">Filiale 2</option>
            <option value="filiale3">Filiale 3</option>
            <option value="filiale4">Filiale 4</option>
            <option value="filiale5">Filiale 5</option>
            <option value="filiale6">Filiale 6</option>
            <option value="filiale7">Filiale 7</option>
            <option value="filiale8">Filiale 8</option>
            <option value="filiale9">Filiale 9</option>
            <option value="filiale10">Filiale 10</option>
          </select>
        </div>
        <div class="form-group">
          <label for="login-pass">Passwort</label>
          <input type="password" id="login-pass" placeholder="Passwort eingeben" />
        </div>
        <button class="btn btn-primary" id="login-btn">Anmelden</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       APP SHELL
       ═══════════════════════════════════════════════════════════════════════ -->
  <div class="app-wrapper" id="app">

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>Profiflora</h1>
        <div class="user-info" id="sidebar-user"></div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="btn-logout" style="color: var(--danger);">
          <span class="nav-icon">↪</span> Abmelden
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <div class="topbar">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
      <div class="page-content" id="page-content">
        <!-- Dynamic content rendered here -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal Container -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/catalog.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
